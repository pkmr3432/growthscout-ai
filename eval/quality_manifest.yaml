# GrowthScout AI — Quality Manifest (Single Source of Truth)
# Enforces quality gates, thresholds, cadences, and baselines across CI/CD environments.

manifest_version: "1.0.0"
created_at: "2026-06-26T20:00:00Z"
last_updated: "2026-06-26T23:05:00Z"
supported_agents_cli_version: ">=0.5.1"
supported_adk_version: ">=0.5.1"
supported_python_version: ">=3.11"
supported_dataset_schema_version: "draft-07"

metadata:
  provider: "google"
  model_version: "gemini-1.5-pro-002"
  model_revision: "2024-09-02"
  temperature: 0.0
  prompt_version: "2.4.0"
  evaluation_version: "1.3.0"

dataset_versions:
  discovery: "1.1.0"
  analysis: "1.1.0"
  recommendation: "1.1.0"
  competitor: "1.1.0"
  opportunity_scoring: "1.1.0"

drift_detection:
  enabled: true
  method: "tfidf"
  thresholds:
    discovery: 0.85
    analysis: 0.85
    recommendation: 0.85
    competitor: 0.85
    opportunity_scoring: 0.85

baseline_versions:
  sprint_6.2: "eval/baselines/sprint_6.2_baseline.json"
  sprint_6.3: "eval/baselines/sprint_6.3_baseline.json"
  rc1: "eval/baselines/rc1_baseline.json"
  active: "eval/baselines/sprint_6.2_baseline.json"

evaluation_cadence:
  fast_ci:
    trigger: "pull_request"
    max_cases_per_dataset: 5  # Limit cases to run Fast CI pipeline quickly
  full_eval:
    trigger: "schedule"       # Nightly or release triggers
    max_cases_per_dataset: 30 # Run all cases in the dataset

metrics:
  deterministic:
    # Deterministic metrics trigger hard build failures if below threshold
    schema_validation:
      threshold: 1.0
      severity: "critical"
      failure_behavior: "fail_build"
    routing_correctness:
      threshold: 1.0
      severity: "critical"
      failure_behavior: "fail_build"
    tool_usage:
      threshold: 1.0
      severity: "high"
      failure_behavior: "fail_build"
    state_transitions:
      threshold: 1.0
      severity: "critical"
      failure_behavior: "fail_build"
    lead_score_correctness:
      threshold: 1.0
      severity: "high"
      failure_behavior: "fail_build"

  probabilistic:
    # Probabilistic metrics trigger warning or secondary validation run
    business_recommendation_value:
      threshold: 0.85
      severity: "medium"
      failure_behavior: "warn_and_require_manual_bypass"
      approval_policy: "lead_evaluator_bypass"
    report_readability:
      threshold: 0.80
      severity: "medium"
      failure_behavior: "warn_and_require_manual_bypass"
      approval_policy: "lead_evaluator_bypass"
    consultant_confidence_score:
      threshold: 0.80
      severity: "high"
      failure_behavior: "trigger_secondary_judge"
      secondary_judge_policy: "double_check_with_high_temp"
      approval_policy: "lead_consultant_bypass"

release_gates:
  fast_ci:
    enforce_deterministic: true
    enforce_probabilistic: false # Warn but don't fail build for probabilistic in Fast CI
  full_eval:
    enforce_deterministic: true
    enforce_probabilistic: true  # Block releases for probabilistic unless bypassed
