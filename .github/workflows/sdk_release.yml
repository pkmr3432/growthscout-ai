# .github/workflows/sdk_release.yml
name: Client SDKs Validation & Release Pipeline

on:
  push:
    branches:
      - main
      - phase-*-*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - phase-*-*

jobs:
  # ────────────────────────────────────────────────────────
  # 1. API Contract & OpenAPI Consistency Validation
  # ────────────────────────────────────────────────────────
  contract_validation:
    name: API Contract Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Platform Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest mypy black flake8

      - name: Run OpenAPI spec compliance and consistency tests
        run: |
          PYTHONPATH=growthscout-python pytest service/tests/ -v

  # ────────────────────────────────────────────────────────
  # 2. Python SDK Validation & Dry-Run Packaging
  # ────────────────────────────────────────────────────────
  python_sdk:
    name: Python SDK Validation & Packaging
    runs-on: ubuntu-latest
    needs: contract_validation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install poetry
          cd growthscout-python
          poetry install

      - name: Lint code with black & flake8
        run: |
          cd growthscout-python
          poetry run black --check growthscout/
          poetry run flake8 growthscout/ --max-line-length=120

      - name: Run Python SDK Unit tests
        run: |
          cd growthscout-python
          poetry run pytest -v

      - name: Build wheel and source distribution packages
        run: |
          cd growthscout-python
          poetry build

      - name: Verify build artifacts exist
        run: |
          ls -la growthscout-python/dist/
          # Ensure both tar.gz source and .whl binary packages are produced
          count=$(ls -1 growthscout-python/dist/*.tar.gz growthscout-python/dist/*.whl 2>/dev/null | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "Packaging failed: missing wheel or source distribution"
            exit 1
          fi

      - name: PyPI publishing dry-run
        run: |
          cd growthscout-python
          # Run poetry publish in dry-run mode to confirm release readiness
          poetry publish --dry-run

  # ────────────────────────────────────────────────────────
  # 3. TypeScript SDK Validation & Dry-Run Packaging
  # ────────────────────────────────────────────────────────
  typescript_sdk:
    name: TypeScript SDK Validation & Bundling
    runs-on: ubuntu-latest
    needs: contract_validation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'growthscout-js/package.json'

      - name: Install TS SDK dependencies
        run: |
          cd growthscout-js
          npm ci

      - name: Compile TS package (CommonJS & ESM build verification)
        run: |
          cd growthscout-js
          npm run build

      - name: Verify TS declaration output bundles
        run: |
          ls -la growthscout-js/dist/cjs/index.js
          ls -la growthscout-js/dist/esm/index.js
          ls -la growthscout-js/dist/types/index.d.ts

      - name: Run TS SDK unit tests
        run: |
          cd growthscout-js
          # Running jest tests
          npm test -- --passWithNoTests

      - name: NPM publishing dry-run
        run: |
          cd growthscout-js
          # Run npm publish in dry-run mode to verify packaging manifest
          npm publish --dry-run
