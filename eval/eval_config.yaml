# Evaluation Configuration: GrowthScout AI
# This file is parsed by agents-cli eval grade to score agent performance.

metrics_to_run:
  - multi_turn_task_success
  - multi_turn_tool_use_quality
  - final_response_quality
  - safety
  - lead_score_correctness # Selected from custom_metrics pool below
  - business_recommendation_value # Selected from custom_metrics pool below
  - report_readability # Selected from custom_metrics pool below
  - consultant_confidence_score # Selected from custom_metrics pool below

custom_metrics:
  - name: lead_score_correctness
    description: "Verifies if the lead score matches the valuation heuristics schema."
    custom_function: |
      def evaluate(instance):
          agent_data = instance.get("agent_data", {})
          turns = agent_data.get("turns", [])
          if not turns:
              return {'score': 0.0, 'explanation': 'No execution turns found.'}
              
          # Find Opportunity Agent output in logs
          lead_score = None
          opportunities = []
          for turn in turns:
              for event in turn.get("events", []):
                  if event.get("author") == "opportunity":
                      content = event.get("content", {})
                      lead_score = content.get("lead_score")
                      opportunities = content.get("opportunities", [])
                      break
          
          if lead_score is None:
              return {'score': 0.0, 'explanation': 'Opportunity Agent did not produce a lead score.'}
              
          # Calculate expected score
          expected_score = 0
          if "no_booking_widget" in opportunities:
              expected_score += 35
          if "slow_loading_mobile" in opportunities:
              expected_score += 30
          if "missing_schema_markup" in opportunities:
              expected_score += 15
          if "missing_google_analytics" in opportunities:
              expected_score += 10
              
          if lead_score == expected_score:
              return {'score': 1.0, 'explanation': f'Correct score of {lead_score} matches gaps.'}
          else:
              return {'score': 0.0, 'explanation': f'Incorrect score. Expected {expected_score}, got {lead_score}.'}

  - name: business_recommendation_value
    description: "Evaluates the relevance, actionability, prioritization, business impact explanation, and practical usefulness of recommendations in consulting engagements."
    prompt_template: |
      You are an expert business consultant grading a Growth Intelligence Report produced by an AI agent.
      Assess the agent's response based on the following five criteria, scoring each from 1 to 5:

      1. Relevance: Are the identified opportunities directly aligned with the target business niche, constraints, and gaps?
      2. Actionability: Are the recommendations concrete, clear, and executable by a non-technical business owner?
      3. Prioritization: Are higher-scoring gaps prioritized in the campaign outline and report hierarchy?
      4. Business Impact Explanation: Does the report translate findings into business consequences (revenue, conversion, retention)?
      5. Consulting Usefulness: Would a consultant feel confident presenting this report to a client without manual edits?

      User Prompt (Context):
      {prompt}

      Agent's Final Response (Report):
      {response}

      Full Trace (Tool Calls & Logs Context):
      {agent_data}

      Return your verdict as a JSON object with "score" and "explanation" keys.
      The score must be a float between 0.0 and 1.0, representing the average of the five criteria (divided by 5).
      JSON format:
      {
        "score": <float between 0.0 and 1.0>,
        "explanation": "<detailed rationale covering each of the 5 criteria>"
      }

  - name: report_readability
    description: "Measures the logical flow, tone, clarity, conciseness, and presentation of the markdown report."
    prompt_template: |
      You are an expert editor grading a Growth Intelligence Report produced by an AI agent.
      Assess the agent's response based on the following four criteria, scoring each from 1 to 5:

      1. Organization & Logical Flow: Clear heading hierarchy, seamless transition between audit findings and recommendations.
      2. Clarity & Readability: Plain language, avoids overly complex syntax, accessible to SMB owners.
      3. Concise Language & Minimal Repetition: No duplicate paragraphs or circular descriptions.
      4. Professional Tone: Consultative, authoritative, encouraging.

      Agent's Final Response (Report):
      {response}

      Return your verdict as a JSON object with "score" and "explanation" keys.
      The score must be a float between 0.0 and 1.0, representing the average of the four criteria (divided by 5).
      JSON format:
      {
        "score": <float between 0.0 and 1.0>,
        "explanation": "<detailed rationale covering each of the 4 criteria>"
      }

  - name: consultant_confidence_score
    description: "Assesses whether an experienced freelance consultant would confidently deliver the generated report to a paying client without significant manual edits."
    prompt_template: |
      You are an elite business consulting judge. Grade the following Growth Intelligence Report produced by our AI agent.
      Assess the report's professional presentation, depth, tone, accuracy, and client-readiness on a scale of 1 to 5:

      1 (Unacceptable): Major spelling/grammar errors, broken markdown formatting, missing critical sections, or completely inaccurate data. Requires a complete rewrite.
      2 (Poor): Accurate raw data but poorly styled, has a generic/cold tone, or minor hallucinations. Needs extensive manual rewriting.
      3 (Average): Useful findings but lacks professional consulting depth, minor formatting inconsistencies, or robotic phrasing. Requires moderate editing.
      4 (Good): High-quality report, professional tone, clean structure, action-oriented insights. Needs only minor cosmetic tweaks.
      5 (Excellent): Outstanding consulting insights, perfect structure, tailored tone, and immaculate presentation. Ready to deliver immediately without modifications.

      User Prompt:
      {prompt}

      Agent's Final Response (Report):
      {response}

      Full Trace (Context):
      {agent_data}

      Return your verdict as a JSON object with "score" and "explanation" keys.
      The score must be a float between 0.0 and 1.0, representing the rubric rating divided by 5 (e.g. rating 4 -> 0.8).
      JSON format:
      {
        "score": <float between 0.0 and 1.0>,
        "explanation": "<detailed justification referencing the rubric criteria>"
      }
