openapi: 3.0.3
info:
  title: GrowthScout AI API
  version: 1.0.0
  description: API Gateway endpoints connecting the Next.js Frontend to the FastAPI backend and ADK agent session engine.
paths:
  /api/v1/sessions:
    post:
      summary: Initialize a growth audit and search session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid request parameters

  /api/v1/sessions/{session_id}:
    get:
      summary: Retrieve the current state and execution logs of a session
      operationId: getSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Session not found

  /api/v1/sessions/{session_id}/approve:
    post:
      summary: Approve the compiled Growth Intelligence Report generated by the agent (Human-in-the-Loop release)
      operationId: approveSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Session approved and moved to completed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid approval payload or session state mismatch
        '404':
          description: Session not found

  /api/v1/leads:
    get:
      summary: Fetch and search local leads from historical databases
      operationId: listLeads
      parameters:
        - name: niche
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of matching business profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessProfile'

components:
  schemas:
    SessionCreateRequest:
      type: object
      required:
        - niche
        - location
      properties:
        niche:
          type: string
          example: "plumber"
          description: Niche category of the business
        location:
          type: string
          example: "Austin, TX"
          description: Geographic query target
        max_leads:
          type: integer
          default: 5
          example: 10

    SessionResponse:
      type: object
      required:
        - session_id
        - status
        - created_at
      properties:
        session_id:
          type: string
          example: "sess_89a0c102"
        status:
          type: string
          enum: [idle, discovering, route_auditing_or_analysis, auditing, opportunity_analysis, report_generation, awaiting_approval, completed, failed, cancelled, no_leads_found]
          example: "awaiting_approval"
        created_at:
          type: string
          format: date-time
          example: "2026-06-24T12:00:00Z"
        leads:
          type: array
          items:
            $ref: '#/components/schemas/BusinessProfile'
        growth_reports:
          type: object
          description: Map of lead names to compiled Growth Intelligence Report markdown.
        proposal_drafts:
          type: object
          description: Map of lead names to generated proposal text and pitch (kept for backward compatibility).

    ApprovalRequest:
      type: object
      required:
        - approved
      properties:
        approved:
          type: boolean
          example: true
        feedback:
          type: string
          example: "Tweak pricing recommendation to $199/month"

    BusinessProfile:
      type: object
      required:
        - business_name
        - website_url
      properties:
        business_name:
          type: string
          example: "Austin Quick Plumbers"
        website_url:
          type: string
          example: "http://austinquickplumbers.com"
        phone:
          type: string
          example: "+15125550199"
        address:
          type: string
          example: "1200 Lavaca St, Austin, TX 78701"
        gaps_identified:
          type: array
          items:
            type: string
          example: ["no_booking_widget", "missing_google_analytics", "poor_mobile_loading_speed"]
